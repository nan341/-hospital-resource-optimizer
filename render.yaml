services:
  - type: web
    name: hospital-resource-optimizer
    env: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///data/hospital.db
      - key: ADMIN_PASSWORD
        value: changeme
      - key: STAFF_ACCESS_CODE
        value: staff123
      - key: JWT_SECRET
        generateValue: true
